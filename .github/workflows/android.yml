name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # needed to publish the test-build pre-release

    env:
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionCode=$VERSION_CODE

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest -PversionCode=$VERSION_CODE

      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest -PversionCode=$VERSION_CODE

      - name: Lint
        run: ./gradlew lintDebug -PversionCode=$VERSION_CODE

      # Release signing: add repository secrets SL_KEYSTORE_BASE64, SL_KEYSTORE_PASSWORD,
      # SL_KEY_ALIAS and SL_KEY_PASSWORD (see docs/RELEASE.md). Without them the release
      # build is still compiled and shrunk, but left unsigned.
      - name: Decode release key
        env:
          SL_KEYSTORE_BASE64: ${{ secrets.SL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SL_KEYSTORE_BASE64" ]; then
            echo "$SL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and bundle
        env:
          SL_KEYSTORE_PASSWORD: ${{ secrets.SL_KEYSTORE_PASSWORD }}
          SL_KEY_ALIAS: ${{ secrets.SL_KEY_ALIAS }}
          SL_KEY_PASSWORD: ${{ secrets.SL_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease -PversionCode=$VERSION_CODE

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sl-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: sl-launcher-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            core/designsystem/build/reports/
          retention-days: 14

      # One stable download link for the newest test build of the development branch.
      - name: Publish test build
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SL-Launcher-Pro-test.apk
          FILES="SL-Launcher-Pro-test.apk"
          if ls app/build/outputs/apk/release/app-release.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/app-release.apk SL-Launcher-Pro-release-signed.apk
            FILES="$FILES SL-Launcher-Pro-release-signed.apk"
          fi
          gh release delete sl-launcher-pro-latest --yes --cleanup-tag || true
          gh release create sl-launcher-pro-latest $FILES \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "SL Launcher Pro test build #$VERSION_CODE" \
            --notes "Latest test build from commit ${GITHUB_SHA::7}. Install SL-Launcher-Pro-test.apk on an Android 8.0+ phone (allow installs from your browser or file manager). This is a debug build for testing, not a Play Store release."
